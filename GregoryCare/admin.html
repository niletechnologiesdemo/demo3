<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Gregory Care · Admin Console</title>
<link rel="icon" href="assets/img/logo-sm.jpg" />
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Playfair+Display:wght@600;700;800&family=Dancing+Script:wght@600&family=Caveat:wght@600&display=swap" rel="stylesheet" />
<link rel="stylesheet" href="assets/css/styles.css?v=4" />
<style>
  .app { display: grid; grid-template-columns: 248px 1fr; min-height: 100vh; }

  /* Sidebar */
  .sidebar {
    background: #fff; border-right: 1px solid var(--gray-200);
    position: sticky; top: 0; height: 100vh; display: flex; flex-direction: column; overflow-y: auto;
  }
  .brand { display: flex; align-items: center; gap: 10px; padding: 18px 18px 14px; border-bottom: 1px solid var(--gray-150); }
  .brand img { width: 46px; height: 46px; object-fit: contain; }
  .brand .t1 { font-family: var(--font-head); font-weight: 800; color: var(--green-deep); font-size: 16px; line-height: 1.1; }
  .brand .t2 { font-size: 11px; color: var(--gray-500); font-weight: 600; letter-spacing: .06em; text-transform: uppercase; margin-top: 2px; }
  .nav { padding: 12px 10px; flex: 1; }
  .nav-label { font-size: 10.5px; font-weight: 700; color: var(--gray-400); letter-spacing: .08em; text-transform: uppercase; padding: 12px 10px 6px; }
  .nav-item {
    display: flex; align-items: center; gap: 10px; padding: 9px 10px; border-radius: 9px;
    color: var(--gray-600); font-weight: 600; font-size: 13.5px; cursor: pointer; margin-bottom: 2px;
  }
  .nav-item:hover { background: var(--brand-50); color: var(--brand-700); }
  .nav-item.active { background: var(--brand-100); color: var(--brand-800); }
  .nav-item.active svg.lucide { color: var(--brand-700); }
  .nav-item .count-pill { margin-left: auto; }
  .nav-item .count-pill.blue { background: var(--brand-700); }
  .side-foot { padding: 12px; border-top: 1px solid var(--gray-150); }
  .me { display: flex; align-items: center; gap: 10px; padding: 8px; border-radius: 10px; }
  .me .n { font-weight: 600; font-size: 13px; color: var(--gray-800); }
  .me .r { font-size: 11.5px; color: var(--gray-500); }

  /* Main */
  .main { min-width: 0; display: flex; flex-direction: column; }
  .topbar {
    height: 64px; background: #fff; border-bottom: 1px solid var(--gray-200); display: flex; align-items: center; gap: 14px;
    padding: 0 28px; position: sticky; top: 0; z-index: 20;
  }
  #demo-slot .demo-bar { position: static; box-shadow: none; }
  .topbar .search { width: 420px; max-width: 100%; position: relative; }
  .search-results {
    position: absolute; top: 44px; left: 0; right: 0; background: #fff; border: 1px solid var(--gray-200); border-radius: 12px;
    box-shadow: var(--shadow-lg); padding: 6px; display: none; max-height: 420px; overflow-y: auto; z-index: 30;
  }
  .search-results.open { display: block; }
  .sr-item { display: flex; gap: 10px; align-items: center; padding: 8px 10px; border-radius: 8px; cursor: pointer; color: var(--gray-700); }
  .sr-item:hover { background: var(--brand-50); }
  .sr-item .ic { width: 30px; height: 30px; border-radius: 8px; background: var(--brand-100); color: var(--brand-700); display: flex; align-items: center; justify-content: center; }
  .sr-group { font-size: 10.5px; font-weight: 700; color: var(--gray-400); text-transform: uppercase; letter-spacing: .08em; padding: 8px 10px 4px; }
  .content { padding: 26px 28px 80px; max-width: 1440px; width: 100%; }
  .page-head { display: flex; align-items: flex-end; justify-content: space-between; gap: 16px; margin-bottom: 20px; flex-wrap: wrap; }
  .page-head .sub { color: var(--gray-500); margin-top: 4px; }
  .back-link { display: inline-flex; align-items: center; gap: 6px; font-size: 13px; font-weight: 600; color: var(--gray-500); cursor: pointer; margin-bottom: 12px; }
  .back-link:hover { color: var(--brand-700); }

  /* KPI */
  .kpis { display: grid; grid-template-columns: repeat(6, 1fr); gap: 14px; margin-bottom: 22px; }
  .kpi { padding: 16px; cursor: pointer; position: relative; }
  .kpi .k-ic { width: 36px; height: 36px; border-radius: 10px; display: flex; align-items: center; justify-content: center; margin-bottom: 12px; }
  .kpi .k-n { font-family: var(--font-head); font-size: 30px; font-weight: 700; color: var(--brand-950); line-height: 1; }
  .kpi .k-l { font-size: 12.5px; color: var(--gray-500); font-weight: 600; margin-top: 6px; }
  .kpi .k-flag { position: absolute; top: 14px; right: 14px; }

  .grid-main { display: grid; grid-template-columns: minmax(0, 1.55fr) minmax(320px, 1fr); gap: 20px; align-items: start; }

  /* Attention list */
  .att { display: flex; align-items: center; gap: 12px; padding: 13px 20px; border-bottom: 1px solid var(--gray-150); cursor: pointer; }
  .att:last-child { border-bottom: 0; }
  .att:hover { background: var(--brand-50); }
  .att .a-ic { width: 36px; height: 36px; border-radius: 10px; display: flex; align-items: center; justify-content: center; flex-shrink: 0; }
  .a-red { background: var(--red-100); color: var(--red-700); }
  .a-blue { background: var(--brand-100); color: var(--brand-700); }
  .a-amber { background: var(--amber-100); color: var(--amber-700); }
  .a-violet { background: var(--violet-100); color: var(--violet-700); }
  .a-green { background: var(--green-100); color: var(--green-700); }
  .a-sun { background: var(--sun-100); color: #7A6500; }
  .a-teal { background: var(--teal-100); color: var(--teal-700); }
  .nav-item .count-pill.amber { background: var(--amber-700); }
  .nav-item .addon-pill { margin-left: 2px; }
  .att .t { font-weight: 600; font-size: 13.5px; color: var(--gray-800); }
  .att .s { font-size: 12.5px; color: var(--gray-500); }

  .sched-day { padding: 10px 20px 4px; font-size: 11.5px; font-weight: 700; color: var(--gray-500); text-transform: uppercase; letter-spacing: .06em; }
  .sched-item { display: flex; gap: 12px; align-items: center; padding: 8px 20px; cursor: pointer; }
  .sched-item:hover { background: var(--brand-50); }
  .sched-item .time { width: 62px; font-weight: 700; font-size: 12.5px; color: var(--brand-800); }
  .sched-item .bar { width: 3px; align-self: stretch; border-radius: 2px; background: var(--brand-600); }

  /* Job file */
  .job-head { padding: 20px 22px 16px; }
  .job-head h1 { font-size: 24px; margin: 8px 0 6px; }
  .job-meta { display: flex; flex-wrap: wrap; gap: 6px 16px; color: var(--gray-500); font-size: 13px; }
  .job-meta span { display: inline-flex; align-items: center; gap: 6px; }
  .job-meta svg.lucide { width: 15px; height: 15px; }
  .job-head .stepper { margin-top: 18px; padding-top: 16px; border-top: 1px solid var(--gray-150); }
  .next-step { border: 1.5px solid var(--brand-200); background: linear-gradient(180deg, var(--brand-50), #fff); }
  .next-step .ns-label { font-size: 11px; font-weight: 700; color: var(--brand-700); text-transform: uppercase; letter-spacing: .08em; }
  .next-step h3 { margin: 6px 0 4px; font-size: 16px; }
  .side-card h4 { font-size: 13px; color: var(--gray-500); text-transform: uppercase; letter-spacing: .06em; font-family: var(--font-body); font-weight: 700; }
  .side-card + .side-card { margin-top: 14px; }
  .person { display: flex; align-items: center; gap: 12px; }
  .person .n { font-weight: 600; color: var(--gray-800); }
  .person .s { font-size: 12.5px; color: var(--gray-500); }
  .mini-kv { display: grid; grid-template-columns: 22px 1fr; gap: 8px 6px; font-size: 13px; color: var(--gray-700); align-items: start; }
  .mini-kv svg.lucide { width: 15px; height: 15px; color: var(--gray-400); margin-top: 2px; }
  .chat-box { max-height: 520px; overflow-y: auto; padding: 18px 20px; }
  .media-cols { display: grid; grid-template-columns: repeat(auto-fill, minmax(190px, 1fr)); gap: 14px; }
  .sec-title { display: flex; align-items: center; gap: 8px; font-weight: 700; font-size: 13px; color: var(--gray-700); margin-bottom: 10px; }
  .signature { font-family: 'Caveat', cursive; font-size: 30px; color: var(--brand-900); line-height: 1; }
  .sig-img { max-height: 80px; background: #fff; border: 1px solid var(--gray-150); border-radius: 8px; }
  .rating-row { display: flex; align-items: center; justify-content: space-between; padding: 8px 0; border-bottom: 1px dashed var(--gray-150); font-size: 13.5px; }

  /* Provider picker */
  .pick { display: flex; align-items: center; gap: 12px; padding: 12px 14px; border: 1.5px solid var(--gray-200); border-radius: 12px; cursor: pointer; }
  .pick + .pick { margin-top: 8px; }
  .pick:hover { border-color: var(--brand-200); }
  .pick.sel { border-color: var(--brand-700); background: var(--brand-50); }
  .pick input { accent-color: var(--brand-700); }
  .sms-preview { background: var(--gray-100); border-radius: 14px; padding: 12px 14px; font-size: 13px; color: var(--gray-700); position: relative; }
  .sms-preview .lbl { font-size: 11px; font-weight: 700; color: var(--gray-500); text-transform: uppercase; letter-spacing: .06em; margin-bottom: 6px; display: flex; gap: 6px; align-items: center; }
  .share-pick { position: relative; }
  .share-pick input { position: absolute; top: 6px; right: 6px; z-index: 2; width: 18px; height: 18px; accent-color: var(--brand-700); }

  /* Calendar */
  .cal { display: grid; grid-template-columns: repeat(7, 1fr); border-top: 1px solid var(--gray-200); border-left: 1px solid var(--gray-200); }
  .cal-h { padding: 8px 10px; font-size: 11.5px; font-weight: 700; color: var(--gray-500); text-transform: uppercase; background: var(--gray-50); border-right: 1px solid var(--gray-200); border-bottom: 1px solid var(--gray-200); }
  .cal-d { min-height: 118px; padding: 6px 6px 8px; border-right: 1px solid var(--gray-200); border-bottom: 1px solid var(--gray-200); background: #fff; }
  .cal-d.out { background: var(--gray-50); }
  .cal-d.out .dn { color: var(--gray-300); }
  .cal-d .dn { font-size: 12px; font-weight: 700; color: var(--gray-600); margin: 0 0 4px 4px; }
  .cal-d.today .dn { background: var(--brand-700); color: #fff; width: 24px; height: 24px; border-radius: 50%; display: inline-flex; align-items: center; justify-content: center; margin-left: 0; }
  .cal-ev { font-size: 11.5px; padding: 3px 6px; border-radius: 6px; margin-bottom: 3px; cursor: pointer; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; font-weight: 600; border-left: 3px solid; }
  .cal-ev.st-scheduled { background: var(--teal-100); color: var(--teal-700); }
  .cal-ev.st-in_progress { background: #DCE6F2; color: var(--brand-900); }
  .cal-ev.st-completed { background: var(--sun-100); color: #7A6500; }
  .cal-ev.st-closed { background: var(--green-100); color: var(--green-700); }
  .cal-ev.st-proposed { background: #fff; color: var(--violet-700); border: 1px dashed var(--violet-700); border-left: 3px solid var(--violet-700); }
  .cal-ev.st-visit { background: #DDF4F1; color: #0E7366; border-left-color: #0E9384; }
  .cal-ev.st-skipped { background: var(--gray-100); color: var(--gray-400); text-decoration: line-through; }
  .cal-ev.st-site { background: var(--violet-100); color: var(--violet-700); }
  .cal-ev.emergency { box-shadow: inset 0 0 0 1px var(--red-600); }
  .legend { display: flex; gap: 14px; flex-wrap: wrap; font-size: 12px; color: var(--gray-600); }
  .legend span { display: inline-flex; align-items: center; gap: 6px; }
  .legend i.sw { width: 10px; height: 10px; border-radius: 3px; display: inline-block; }

  /* Properties */
  .prop-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(290px, 1fr)); gap: 16px; }
  .prop-card { padding: 18px; }
  .prop-ic { width: 44px; height: 44px; border-radius: 12px; display: flex; align-items: center; justify-content: center; }
  .prop-ic.Residential { background: var(--leaf-100); color: #4F7A12; }
  .prop-ic.Commercial { background: var(--brand-100); color: var(--brand-700); }
  .prop-ic.OilGas { background: var(--sand-100); color: var(--sand-700); }
  .prop-stats { display: flex; gap: 18px; margin-top: 14px; padding-top: 12px; border-top: 1px solid var(--gray-150); font-size: 12.5px; color: var(--gray-500); }
  .prop-stats b { display: block; font-size: 17px; color: var(--brand-950); font-family: var(--font-head); }
  .hero-prop { display: grid; grid-template-columns: 1fr auto; gap: 20px; padding: 22px; }
  .stat-row { display: flex; gap: 26px; }
  .stat-row div b { display: block; font-family: var(--font-head); font-size: 26px; color: var(--brand-950); line-height: 1.1; }
  .stat-row div { font-size: 12px; color: var(--gray-500); font-weight: 600; }

  /* Messages */
  .inbox { display: grid; grid-template-columns: 360px 1fr; height: calc(100vh - 64px - 130px); min-height: 520px; overflow: hidden; }
  .inbox-list { border-right: 1px solid var(--gray-200); display: flex; flex-direction: column; min-height: 0; }
  .inbox-list .lst { overflow-y: auto; flex: 1; }
  .th-item { display: flex; gap: 10px; padding: 12px 16px; border-bottom: 1px solid var(--gray-150); cursor: pointer; }
  .th-item:hover { background: var(--gray-50); }
  .th-item.sel { background: var(--brand-50); box-shadow: inset 3px 0 0 var(--brand-700); }
  .th-item .n { font-weight: 600; font-size: 13.5px; }
  .th-item .j { font-size: 11.5px; color: var(--brand-700); font-weight: 600; }
  .th-item .p { font-size: 12.5px; color: var(--gray-500); }
  .th-item .unread-dot { width: 9px; height: 9px; border-radius: 50%; background: var(--red-600); margin-top: 6px; flex-shrink: 0; }
  .inbox-thread { display: flex; flex-direction: column; min-height: 0; }
  .inbox-thread .th-head { padding: 14px 20px; border-bottom: 1px solid var(--gray-200); display: flex; align-items: center; gap: 12px; }
  .inbox-thread .th-body { flex: 1; overflow-y: auto; padding: 18px 20px; }
  .inbox-thread .th-foot { padding: 0 20px 16px; }

  /* Announcements */
  .ann { padding: 18px 20px; display: flex; gap: 16px; }
  .ann .a-ic { width: 42px; height: 42px; border-radius: 12px; background: var(--sun-100); color: #7A6500; display: flex; align-items: center; justify-content: center; flex-shrink: 0; }
  .ann + .ann { border-top: 1px solid var(--gray-150); }

  .cred-card { background: var(--brand-950); color: #fff; border-radius: 14px; padding: 18px; }
  .cred-card .k { font-size: 11px; text-transform: uppercase; letter-spacing: .08em; color: rgba(255,255,255,.6); font-weight: 700; }
  .cred-card .v { font-family: ui-monospace, Menlo, monospace; font-size: 15px; margin-top: 2px; }
  .cred-card .row + .row { margin-top: 12px; }
  .prop-row { display: grid; grid-template-columns: 1.1fr 1.4fr 150px 36px; gap: 8px; align-items: center; }
  .prop-row + .prop-row { margin-top: 8px; }

  .week { display: grid; grid-template-columns: repeat(7, minmax(0,1fr)); gap: 10px; }
  .wk-col { background: #fff; border: 1px solid var(--gray-200); border-radius: 12px; min-height: 360px; display: flex; flex-direction: column; }
  .wk-col.today { border-color: var(--brand-500); box-shadow: 0 0 0 3px var(--brand-100); }
  .wk-h { padding: 10px 12px; border-bottom: 1px solid var(--gray-150); }
  .wk-h b { display: block; font-family: var(--font-head); font-size: 20px; color: var(--brand-950); }
  .wk-h span { font-size: 11px; font-weight: 700; color: var(--gray-500); text-transform: uppercase; letter-spacing: .06em; }
  .wk-body { padding: 8px; display: flex; flex-direction: column; gap: 6px; }
  .wk-ev { border-radius: 9px; padding: 7px 9px; font-size: 12px; cursor: pointer; border-left: 4px solid; background: var(--brand-50); }
  .wk-ev:hover { box-shadow: var(--shadow-md); }
  .wk-ev .t { font-weight: 700; color: var(--gray-800); }
  .wk-ev .n { color: var(--gray-700); font-weight: 600; margin-top: 1px; }
  .wk-ev .c { color: var(--gray-500); font-size: 11px; margin-top: 2px; }
  .sched-row { display: grid; grid-template-columns: 1.4fr 1fr 1fr 1.6fr 36px; gap: 8px; align-items: center; padding: 8px 0; border-bottom: 1px solid var(--gray-150); }
  .sched-row .input, .sched-row .select { height: 36px; font-size: 13px; }
  .team-card { display: flex; align-items: center; gap: 12px; padding: 12px 20px; border-bottom: 1px solid var(--gray-150); }
  .team-card:last-child { border-bottom: 0; }
  .cg-dot { width: 10px; height: 10px; border-radius: 50%; flex-shrink: 0; }
  @media (max-width: 1280px) { .kpis { grid-template-columns: repeat(3, 1fr); } #today-label { display: none; } }
  @media (max-width: 1100px) { .grid-main { grid-template-columns: 1fr; } }
  @media (max-width: 860px) {
    .app { grid-template-columns: 1fr; }
    .sidebar { position: fixed; left: -260px; width: 248px; z-index: 50; transition: left .2s; box-shadow: var(--shadow-lg); }
    .sidebar.open { left: 0; }
    .menu-btn { display: inline-flex !important; }
    .topbar { padding: 0 16px; }
    .content { padding: 18px 16px 80px; }
    .kpis { grid-template-columns: repeat(2, 1fr); }
    .inbox { grid-template-columns: 1fr; height: auto; }
    .hero-prop { grid-template-columns: 1fr; }
    .grid-2 { grid-template-columns: 1fr; }
    .prop-row { grid-template-columns: 1fr; }
  }
</style>
</head>
<body>
<div class="app">
  <aside class="sidebar" id="sidebar">
    <div class="brand">
      <img src="assets/img/logo-sm.jpg" alt="Gregory Care Services logo" />
      <div><div class="t1">Gregory Care<br>Services</div><div class="t2">Admin Console</div></div>
    </div>
    <nav class="nav" id="nav"></nav>
    <div class="side-foot">
      <div class="me">
        <div class="avatar av-admin">GC</div>
        <div class="grow"><div class="n ellipsis">Owner</div><div class="r">Admin & Caregiver</div></div>
        <i data-lucide="log-out" class="ic-sm" style="color:var(--gray-400)"></i>
      </div>
    </div>
  </aside>

  <div class="main">
    <header class="topbar">
      <button class="icon-btn menu-btn" style="display:none" onclick="document.getElementById('sidebar').classList.toggle('open')"><i data-lucide="menu"></i></button>
      <div class="search">
        <i data-lucide="search"></i>
        <input id="gsearch" placeholder="Search clients, care recipients, bookings, caregivers…" autocomplete="off" oninput="globalSearch(this.value)" onfocus="globalSearch(this.value)" />
        <div class="search-results" id="gsearch-results"></div>
      </div>
      <div class="grow"></div>
      <span class="muted text-sm nowrap" id="today-label"></span>
      <span id="demo-slot"></span>
    </header>
    <main class="content" id="view"></main>
  </div>
</div>

<script src="assets/vendor/lucide.min.js"></script>
<script src="assets/js/data.js?v=4"></script>
<script src="assets/js/core.js?v=4"></script>
<script src="assets/js/admin.js?v=4"></script>
</body>
</html>
